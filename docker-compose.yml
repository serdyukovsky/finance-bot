services:
  bot:
    build: .
    env_file: .env
    volumes:
      - ./secrets:/app/secrets:ro
    restart: unless-stopped
    # сеть хоста: Telegram — через xray-клиент на 127.0.0.1 (TELEGRAM_PROXY в .env)
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
